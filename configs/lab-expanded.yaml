lab:
  name: project1-srl-expanded-lab
  container_prefix: clab-srl-expanded-
  network_instance: default
  routers:
    - R1
    - R2
    - R3

connectivity_tests:
  - name: R1_to_R2
    source: R1
    destination: 10.0.12.2

  - name: R1_to_R3
    source: R1
    destination: 10.0.31.2

  - name: R2_to_R3
    source: R2
    destination: 10.0.23.2

interface_tests:
  - name: R1_ethernet_1_1_up
    router: R1
    interface: ethernet-1/1
    expected_state: up

  - name: R1_ethernet_1_2_up
    router: R1
    interface: ethernet-1/2
    expected_state: up

  - name: R2_ethernet_1_1_up
    router: R2
    interface: ethernet-1/1
    expected_state: up

  - name: R2_ethernet_1_2_up
    router: R2
    interface: ethernet-1/2
    expected_state: up

  - name: R3_ethernet_1_1_up
    router: R3
    interface: ethernet-1/1
    expected_state: up

  - name: R3_ethernet_1_2_up
    router: R3
    interface: ethernet-1/2
    expected_state: up

  - name: R1_ethernet_1_3_up
    router: R1
    interface: ethernet-1/3
    expected_state: up

  - name: R2_ethernet_1_3_up
    router: R2
    interface: ethernet-1/3
    expected_state: up

ospf_neighbor_tests:
  - name: R1_to_R2_OSPF_FULL
    router: R1
    interface: ethernet-1/1.0
    neighbor_router_id: 2.2.2.2
    expected_state: full

  - name: R1_to_R3_OSPF_FULL
    router: R1
    interface: ethernet-1/2.0
    neighbor_router_id: 3.3.3.3
    expected_state: full

  - name: R2_to_R1_OSPF_FULL
    router: R2
    interface: ethernet-1/1.0
    neighbor_router_id: 1.1.1.1
    expected_state: full

  - name: R2_to_R3_OSPF_FULL
    router: R2
    interface: ethernet-1/2.0
    neighbor_router_id: 3.3.3.3
    expected_state: full

  - name: R3_to_R2_OSPF_FULL
    router: R3
    interface: ethernet-1/1.0
    neighbor_router_id: 2.2.2.2
    expected_state: full

  - name: R3_to_R1_OSPF_FULL
    router: R3
    interface: ethernet-1/2.0
    neighbor_router_id: 1.1.1.1
    expected_state: full

route_tests:
  - name: R1_to_R2_loopback
    router: R1
    prefix: 10.255.0.2/32
    expected_route_type: ospfv2
    expected_next_hop: 10.0.12.2
    expected_interface: ethernet-1/1.0
    expected_best: true

  - name: R1_to_R3_loopback
    router: R1
    prefix: 10.255.0.3/32
    expected_route_type: ospfv2
    expected_next_hop: 10.0.31.2
    expected_interface: ethernet-1/2.0
    expected_best: true

  - name: R2_to_R1_loopback
    router: R2
    prefix: 10.255.0.1/32
    expected_route_type: ospfv2
    expected_next_hop: 10.0.12.1
    expected_interface: ethernet-1/1.0
    expected_best: true

  - name: R2_to_R3_loopback
    router: R2
    prefix: 10.255.0.3/32
    expected_route_type: ospfv2
    expected_next_hop: 10.0.23.2
    expected_interface: ethernet-1/2.0
    expected_best: true

  - name: R3_to_R1_loopback
    router: R3
    prefix: 10.255.0.1/32
    expected_route_type: ospfv2
    expected_next_hop: 10.0.31.1
    expected_interface: ethernet-1/2.0
    expected_best: true

  - name: R3_to_R2_loopback
    router: R3
    prefix: 10.255.0.2/32
    expected_route_type: ospfv2
    expected_next_hop: 10.0.23.1
    expected_interface: ethernet-1/1.0
    expected_best: true

tcp_application_tests:
  - name: H1_to_H2_tcp_echo
    client: H1
    server: H2
    destination: 10.0.24.2
    port: 18080
    payload: NETWORK_VALIDATION
    expected_response: TCP_OK:NETWORK_VALIDATION

udp_application_tests:
  - name: H1_to_H2_udp_echo
    client: H1
    server: H2
    destination: 10.0.24.2
    port: 18081
    payload: NETWORK_VALIDATION
    expected_response: UDP_OK:NETWORK_VALIDATION

iperf3_tcp_tests:
  - name: H1_to_H2_tcp_10Mbps
    client: H1
    server: H2
    destination: 10.0.24.2
    port: 5201
    duration_seconds: 10
    interval_seconds: 1
    target_bitrate_mbps: 10
    tcp_mss_bytes: 1400
    min_receiver_mbps: 9.0
    max_retransmits: 20

  - name: H1_to_H2_tcp_25Mbps
    client: H1
    server: H2
    destination: 10.0.24.2
    port: 5201
    duration_seconds: 10
    interval_seconds: 1
    target_bitrate_mbps: 25
    tcp_mss_bytes: 1400
    min_receiver_mbps: 22.5
    max_retransmits: 20

  - name: H1_to_H2_tcp_50Mbps
    client: H1
    server: H2
    destination: 10.0.24.2
    port: 5201
    duration_seconds: 10
    interval_seconds: 1
    target_bitrate_mbps: 50
    tcp_mss_bytes: 1400
    min_receiver_mbps: 45.0
    max_retransmits: 20

iperf3_udp_tests:
  - name: H1_to_H2_udp_10Mbps
    client: H1
    server: H2
    destination: 10.0.24.2
    port: 5201
    duration_seconds: 10
    interval_seconds: 1
    target_bitrate_mbps: 10
    min_receiver_mbps: 9.0
    max_loss_percent: 0.1
    max_jitter_ms: 1.0
